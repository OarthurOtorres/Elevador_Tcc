<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Elevador - TCC</title>
    <style>
        /* AQUI VOCÊ CUSTOMIZA AS CORES E O DESIGN (CSS) */
        body {
            background-color: #1e1e24;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h1 { margin-bottom: 5px; font-size: 24px; color: #00adb5; }
        .status-conexao { margin-bottom: 25px; font-size: 14px; color: #ff4d4d; }

        /* Painel que imita o de um elevador real */
        .painel-elevador {
            background-color: #2a2a35;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.5);
            border: 2px solid #3f3f50;
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 260px;
        }

        /* Linha que junta o Botão e o LED indicador */
        .linha-controle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #343444;
            padding: 12px 20px;
            border-radius: 12px;
        }

        /* Estilo dos botões redondos dos andares */
        .btn-andar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 2px solid #00adb5;
            background-color: #222831;
            color: #00adb5;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-andar:active { background-color: #00adb5; color: #222831; }

        /* Botão de Emergência de Destaque */
        .btn-emergencia {
            width: 100%;
            padding: 15px;
            background-color: #d9534f;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0px 4px 10px rgba(217, 83, 79, 0.4);
        }
        .btn-emergencia:active { background-color: #c9302c; }

        /* O LED virtual na tela do celular */
        .led-virtual {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: #4b4b5a; /* Desligado (Cinza escuro) */
            box-shadow: inset 0 0 5px rgba(0,0,0,0.6);
            transition: background-color 0.2s;
        }

        /* Classe que o JavaScript vai colocar para ACENDER o led */
        .led-virtual.aceso-azul { background-color: #00adb5; box-shadow: 0 0 15px #00adb5; }
        .led-virtual.aceso-vermelho { background-color: #ff4d4d; box-shadow: 0 0 15px #ff4d4d; }

        .btn-conectar {
            padding: 10px 20px;
            background-color: #00adb5;
            color: #1e1e24;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <h1>ELEVADOR AUTOMÁTICO</h1>
    <button class="btn-conectar" id="btnConectar">CONECTAR BLUETOOTH</button>
    <div class="status-conexao" id="statusTxt">Desconectado</div>

    <!-- O PAINEL DO SEU JEITO -->
    <div class="painel-elevador">
        
        <div class="linha-controle">
            <button class="btn-andar" onclick="enviarComando('3')">3</button>
            <div class="led-virtual" id="ledC"></div>
        </div>

        <div class="linha-controle">
            <button class="btn-andar" onclick="enviarComando('2')">2</button>
            <div class="led-virtual" id="ledB"></div>
        </div>

        <div class="linha-controle">
            <button class="btn-andar" onclick="enviarComando('1')">1</button>
            <div class="led-virtual" id="ledA"></div>
        </div>

        <button class="btn-emergencia" onclick="enviarComando('E')">💥 Emergência</button>
        <div style="display:flex; justify-content:center; margin-top:-10px;">
            <div class="led-virtual" id="ledX"></div>
        </div>

    </div>

    <script>
        // LÓGICA DO WEB BLUETOOTH (JAVASCRIPT)
        let caracteristicaTx = null;
        const statusTxt = document.getElementById('statusTxt');
        const btnConectar = document.getElementById('btnConectar');

        btnConectar.addEventListener('click', async () => {
            try {
                statusTxt.innerText = "Buscando dispositivo...";
                // Busca o módulo Bluetooth que tenha serviço de comunicação serial (Nordic UART/similar)
                const dispositivo = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'HC-' }], // Filtra por HC-05 ou HC-06
                    optionalServices: ['00001101-0000-1000-8000-00805f9b34fb'] // UUID Serial padrão
                });

                const servidor = await dispositivo.gatt.connect();
                statusTxt.innerText = "Conectado com sucesso!";
                statusTxt.style.color = "#00adb5";
                
                // Pega o canal de comunicação para ler e enviar dados
                const servico = await servidor.getPrimaryService('00001101-0000-1000-8000-00805f9b34fb');
                caracteristicaTx = await servico.getCharacteristic('00001101-0000-1000-8000-00805f9b34fb');
                
                // Começa a escutar o que o Arduino manda de volta
                await caracteristicaTx.startNotifications();
                caracteristicaTx.addEventListener('characteristicvaluechanged', tratarDadosRecebidos);

            } catch (erro) {
                statusTxt.innerText = "Erro ao conectar. Tente novamente.";
                console.log(erro);
            }
        });

        // Envia os comandos '1', '2', '3' ou 'E' para o Arduino
        async function enviarComando(caractere) {
            if (!caracteristicaTx) return;
            const encoder = new TextEncoder();
            await caracteristicaTx.writeValue(encoder.encode(caractere));
        }

        // Escuta o Arduino mandando as flags de ligar e desligar os LEDs (*A1, *A0, etc)
        function tratarDadosRecebidos(evento) {
            const decoder = new TextDecoder();
            const texto = decoder.decode(evento.target.value).trim();
            
            // Se o texto começar com nosso padrão de controle *
            if(texto.startsWith('*')) {
                const ledId = "led" + texto.charAt(1); // Ex: ledA, ledB, ledC, ledX
                const status = texto.charAt(2);        // 1 ou 0
                const elementoLed = document.getElementById(ledId);
                
                if(elementoLed) {
                    if(status === '1') {
                        // Se for o led de emergência (X), acende vermelho, senão azul
                        elementoLed.classList.add(ledId === 'ledX' ? 'aceso-vermelho' : 'aceso-azul');
                    } else {
                        elementoLed.classList.remove('aceso-vermelho', 'aceso-azul');
                    }
                }
            }
        }
    </script>
</body>
</html>
